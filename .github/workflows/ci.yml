name: Continuous Deployment Pipeline

on:
  push:
  pull_request:
    branches: [main, dev]

jobs:
  # JOB 1: Build (composer install tanpa dev, simpan artifact)
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-artifact
          path: vendor/

  # JOB 2: Test (uji fitur & unit test secara otomatis)
  test:
    name: Automated Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Dependencies for Testing
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Test Suite
        run: php artisan test

  # JOB 3: Staging (simulasi deploy ke server tiruan)
  staging:
    name: Staging Deployment
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Staging Deployment
        run: |
          echo "Menjalankan deployment otomatis ke server staging..."
          echo "Simulasi verifikasi lingkungan staging berhasil."

  # JOB 4: Production (hanya branch main + required reviewer)
  production:
    name: Production Deployment
    needs: [test, staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run 7 Deployment Steps (deploy.sh)
        run: |
          bash deploy.sh